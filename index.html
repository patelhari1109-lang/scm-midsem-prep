        '8,000 units; the failure was the marketplace accepting orders for hours after the saleable stock had run out',
        '6,500 units; the failure was the quality team holding stock during a promotion week',
        '9,000 units; the failure was the supplier\'s 20-day packaging lead time being too long'],
  why:'<b>Promise against saleable, uncommitted stock, and check whether replenishment can arrive in time.</b><div class="work">8,000 − 1,500 hold − 900 reserved = 5,600 saleable\npromise 9,000 → gap 3,400\npackaging lead time 20 days → no quick recovery</div>8,000 is the book figure. 6,500 forgets the reservation. Blaming the 20-day lead time misses that it was a known fact before the commitment.<br><br>The category manager owns the commercial promise. Five checks come first: saleable stock, committed stock, replenishment lead time, fulfilment capacity and a failure rule.'},

 {t:'why',tag:'apply',diff:'medium',
  q:'A key-account manager posts "₹3 crore record sale!" after a marketplace event. Platform fees and ads took 22%, returns hit 16% due to a wrong listing, stock shipped by express from far-off warehouses, and the platform settles in 45 days. How should the event be judged?',
  opts:['On contribution after fees, fulfilment and returns, plus how long cash stays blocked',
        'On gross sales, since it is the figure the marketplace and leadership both report and track',
        'On units sold, because volume is the cleanest measure of the account\'s demand',
        'On the return rate alone, since the listing error is the only real supply issue'],
  why:'<b>Revenue can look impressive while cost to serve, returns and cash delay destroy value.</b><div class="work">gross sales\n− commissions and ads (22%)\n− express freight (poor stock position)\n− returns, inspection, replacements (16%)\n= contribution, then ask: when does the cash arrive?</div>Gross sales and units ignore every cost in the stem. The return rate is one leak; the express freight caused by stock sitting far from demand is another.<br><br>Five checks before celebrating: realised price, cost to serve, returns, working capital, customer promise.'},

 {t:'why',tag:'apply',diff:'medium',
  q:'A retail head sends 250 units of a new jacket to each of 30 stores. Two metros sell out of M and L in one weekend; three smaller cities sit on weeks of slow colours. National stock looks healthy. What is the right diagnosis and first move?',
  opts:['Equal allocation ignored local demand; reallocate by store-SKU sell-through, then fix the next allocation',
        'National stock is too low; buy more units so that every one of the 30 stores gets a fresh top-up allocation',
        'The price is wrong; run a national markdown so the whole range clears at the same speed',
        'The metros over-sold; cap their sales so the slow stores can catch up on their share'],
  why:'<b>Customers do not shop national inventory; they buy a specific SKU in a reachable location.</b><div class="work">metros: stock-out of M/L  → lost full-price sales\nsmall cities: slow colours → markdown risk\nsame national total, wrong position</div>Buying more adds cash and markdown exposure before using what you already own. A national markdown gives away margin where stock was selling anyway. Transfer only where the expected margin exceeds the transfer cost.<br><br>High total inventory and poor availability can coexist. Measure availability where demand occurs.'},

 /* ===================== 2 · NETWORK, FLOWS & LEAD TIME ===================== */
 {t:'net',tag:'concept',diff:'easy',
  q:'A juice brand buys cartons from a carton maker, who buys paperboard from a mill. From the <b>carton maker\'s</b> point of view, which statement is correct?',
  opts:['The mill is upstream and the juice brand is downstream',
        'The juice brand is upstream because it places the orders',
        'The mill is a Tier 1 supplier to the carton maker\'s own customer',
        'Both the mill and the juice brand sit downstream of the carton maker'],
  why:'<b>Upstream and downstream depend on where you stand.</b> Closer to the source is upstream; closer to the consumer is downstream.<div class="work">mill → carton maker → juice brand → retailer → consumer\n(for the brand: carton maker = Tier 1, mill = Tier 2)</div>Placing orders does not make a firm upstream: orders flow up, goods flow down. The mill is Tier 2 to the juice brand, not Tier 1.<br><br>Always fix the focal company before labelling tiers or direction.'},

 {t:'net',tag:'apply',diff:'medium',
  q:'A snack brand proudly reports "three approved packaging suppliers, so no single-source risk". All three buy their laminate film from the same overseas plant. What is the correct reading?',
  opts:['Three Tier 1 suppliers on paper, but one Tier 2 source is a hidden single point of failure',
        'Risk is diversified, because any one of the three can step in quickly if another one of them fails',
        'The risk sits only with the overseas plant, so it is not the snack brand\'s concern',
        'The brand should add a fourth Tier 1 supplier, which fully removes the exposure'],
  why:'<b>Diversification must be checked one tier deeper.</b> If every Tier 1 supplier depends on one Tier 2 source, a disruption there stops all three at once.<div class="work">Supplier A ┐\nSupplier B ├→ one laminate plant (Tier 2) → single point of failure\nSupplier C ┘</div>A fourth Tier 1 supplier fixes nothing if it buys from the same plant. "Not our concern" is wrong: the brand\'s shelves go empty either way.<br><br>Map the network, not just the vendor list.'},

 {t:'net',tag:'apply',diff:'medium',
  q:'A phone order is accepted and paid, then cancelled the next morning because the warehouse cannot find the unit the system showed as in stock. Which flow failed, and what is the fix?',
  opts:['The information flow; the stock record did not match physical stock, so fix inventory accuracy',
        'The physical flow; the courier was not booked in time, so add more delivery capacity overnight',
        'The cash flow; the payment had not settled, so the seller could not release the order on time',
        'The reverse flow; the unit was out on a return, so returns should be processed much faster'],
  why:'<b>Three flows move at different speeds: physical, information and cash.</b> Information often moves first and fastest, but it only helps when it is accurate, complete, connected to the physical system and acted upon.<div class="work">order → system reserves 1 unit (information ✓)\npick → unit not there (record ≠ reality ✗)\n→ cancellation + refund (cash reversal)</div>Nothing physical was late, and the cash cleared. A wrong stock record is an information failure even though its symptom shows up in the warehouse.<br><br>A product can move correctly while information or cash fails. The promise still collapses.'},

 {t:'net',tag:'calc',diff:'medium',
  given:['Ingredients: 14 days','Jars: 9 days (in parallel)','Scheduling: 4 days','Make + quality release: 5 days','Plant → warehouse: 3 days','Customer delivery: 2 days'],
  q:'Ingredients and jars are ordered at the same time; production cannot be scheduled until both arrive. What is the end-to-end lead time?',
  opts:['28 days, because the slower of the two parallel buys controls the start',
        '37 days, because every activity in the list has to be added together',
        '14 days, because the longest single activity sets the total lead time here',
        '23 days, because the jar path is the one that triggers the schedule'],
  why:'<b>End-to-end lead time depends on sequence, overlap and the slowest critical activity.</b><div class="work">parallel buys: max(14, 9) = 14\nthen 4 + 5 + 3 + 2 = 14\ntotal = 14 + 14 = 28 days</div>37 adds the parallel jar purchase as if it were sequential. 14 forgets everything after the inputs arrive. 23 follows the faster, non-critical path.<br><br>Dependencies chain delays: production waits for approved material, dispatch waits for quality release.'},

 {t:'net',tag:'apply',diff:'medium',trap:true,
  q:'At 10 p.m. a parent needs an antacid tonight. The pharmacy chain holds 4,000 units in its city warehouse 25 km away, but the nearby outlet and dark store have none. Is the product "available"?',
  opts:['No; availability needs saleable stock at a reachable location within the promised time',
        'Yes; the chain owns 4,000 units in the city, so the customer\'s need can be served',
        'Yes; inventory and availability are the same as long as the stock is held in the same city',
        'No; the units should be classed as damaged stock until they reach the nearby outlet'],
  why:'<b>Inventory is what the business owns or records; availability is what the customer can buy or use against the promise.</b><div class="work">availability = right product × right quantity × saleable condition\n             × right location × within promised time\nhere: location ✗, time ✗ → not available tonight</div>The trap is "we have 4,000 units". Distant stock has no value for tonight\'s promise. It is not damaged either; it is simply in the wrong node.<br><br>Inventory anywhere in the network is not enough.'},

 /* ===================== 3 · FOUR OUTCOMES & TRADE-OFFS ===================== */
 {t:'perf',tag:'apply',diff:'medium',
  q:'Procurement buys eight months of bottles at once to secure a 9% price cut and books the saving against its target. What is the system-level verdict?',
  opts:['Local optimisation: price falls, but blocked cash, storage, damage and obsolescence risk rise',
        'A clear win: lower unit price always lowers the total cost of serving the end customer as well',
        'Neutral: inventory is an asset on the balance sheet, so no cost has been incurred',
        'A service gain: holding more bottles always improves availability for customers'],
  why:'<b>Local optimisation improves one function\'s metric while damaging the complete system.</b><div class="work">local result     unit price −9%, savings target met\nsystem result    cash blocked for 8 months\n                 storage + handling ↑\n                 artwork change → obsolete bottles\n                 forecast risk ↑</div>"Inventory is an asset" ignores holding cost and write-off risk. More bottles do not create finished-product availability if anything else is short.<br><br>Judge a decision through total cost and customer impact, not the metric of the department taking it.'},

 {t:'perf',tag:'concept',diff:'medium',cols:['Functional decision','Likely system damage'],
  q:'Match each functional decision to the damage it most likely causes elsewhere.',
  match:[['Finance cuts inventory sharply across all nodes','Stock-outs and lost sales'],
         ['Manufacturing runs very long batches','Slow response and unwanted stock'],
         ['Logistics picks the cheapest carrier','Late deliveries and complaints'],
         ['Marketing launches an unplanned promotion','Capacity and availability failure'],
         ['Sales promises immediate delivery to win the deal','Expediting cost and service failure']],
  why:'Every row is a <b>local win with a system cost</b>. The four outcomes (availability, service, inventory, total cost) must be read together, because a decision that improves one usually moves another.'},

 {t:'perf',tag:'apply',diff:'medium',
  q:'During a cricket final, a quick-commerce zone\'s orders jump from 1,100 to 1,700 an hour while rider capacity covers only 65% of the surge. The app still shows "10 minutes" for every address. What should the manager do for the next two hours?',
  opts:['Segment the promise: protect essentials nearby, show honest longer slots and trim the radius',
        'Keep 10 minutes for everyone and fund surge payouts until the order spike passes',
        'Switch every order to a single 60-minute promise so the network can catch up',
        'Move more inventory into the dark store so that the fast-moving SKUs do not run out during the surge'],
  why:'<b>The service failure began when the app kept accepting a promise that capacity could not meet.</b> Time and capacity are the buffers here; extra inventory cannot move itself.<div class="work">            avail.    service      inventory      cost\nkeep 10 min  broad    high failure  fast movers drain  very high\nblanket 60   broad    reliable     lower pressure   moderate\nsegment      essentials protected  achievable  focused  controlled</div>The blanket option over-penalises urgent, nearby orders. Adding stock attacks a bottleneck that is not there.<br><br>No option is free. Pick the one whose complete consequence fits the promise.'},

 {t:'perf',tag:'calc',diff:'medium',
  given:['Promotion forecast: 10,000','Saleable stock: 6,000','Can still make before launch: 1,500','Sleeve lead time: 12 days','Launch in: 8 days'],
  q:'Marketing wants a festive offer forecast at 10,000 gift packs. Anything beyond what can be made from materials on hand needs new sleeves. How many packs should the offer be capped at?',
  opts:['7,500, the saleable stock plus what can be completed before launch',
        '10,000, since the forecast is the demand the offer will actually create',
        '6,000, since only finished saleable stock can ever back a promotion',
        '8,500, adding one more production run on top of the stock in hand'],
  why:'<b>Sell the quantity the system can support.</b> Then allocate it deliberately and reshape the rest of demand.<div class="work">6,000 saleable + 1,500 makeable = 7,500 feasible\nsleeves need 12 days > 8 days to launch → no more\nremaining 2,500 → pre-order / later slot / second wave</div>Accepting 10,000 creates cancellations and stock-outs of popular packs. 6,000 ignores production that is genuinely feasible. 8,500 invents a run with no materials.<br><br>A promotion creates value only when the business can fulfil the demand it creates. Agree quantity, allocation and promise before orders open.'},

 {t:'perf',tag:'calc',diff:'medium',trap:true,
  given:['20 orders','11 on time and in full','5 on time, short-shipped','2 late, in full','2 late and short'],
  q:'A distributor reviews 20 orders against the agreed promise. What is its OTIF?',
  opts:['55%','80%','65%','52%'],
  why:'<b>OTIF counts only orders that are both on time and in full.</b><div class="work">on time   = 11 + 5 = 16 → 80%\nin full   = 11 + 2 = 13 → 65%\nOTIF      = 11 only      → 55%</div>80% and 65% each measure one half. 52% multiplies the two rates (0.80 × 0.65), which assumes the failures are independent; you have the order-level data, so count it.<br><br>OTIF is measured against the <i>agreed</i> promise, order by order.'},

 {t:'perf',tag:'apply',diff:'hard',
  q:'A retail chain ordered 2,000 mixers for a Friday launch. Only 1,700 are saleable; 300 clear quality on Tuesday. A regional transfer costs ₹1.2 lakh; the late-delivery penalty is ₹2 lakh. What should the account manager do?',
  opts:['Confirm whether the full launch quantity matters; transfer if so, or agree a written split before Friday',
        'Ship 1,700 on Friday and the rest on Tuesday; it is on time, so the agreed service measure is still fully met',
        'Hold the entire order until Tuesday so that the customer receives one complete delivery',
        'Transfer the stock automatically, since ₹1.2 lakh is lower than the penalty in every case'],
  why:'<b>A revised split becomes the promise only when the customer accepts it before the due time.</b><div class="work">ship 1,700 unagreed → on time ✓, in full ✗ → OTIF fail, penalty likely\nhold all to Tue      → in full ✓, on time ✗ → launch missed\nagree or recover     → promise protected; ₹1.2L if transfer needed</div>"On time, so it passes" is the trap. The automatic transfer ignores that the penalty is not the only stake: contribution, launch impact and the account relationship also count, and the customer may happily accept a split.<br><br>Change the promise before it fails, not after.'},

 {t:'perf',tag:'calc',diff:'hard',
  given:['Orders: 2,100 pairs/week','Return rate: 24%','Pickup → resale decision: 10 days','Stock value: ₹1,400/pair'],
  q:'A footwear brand offers free exchange. Roughly how much stock value sits in the reverse pipeline at any time, unavailable for sale?',
  opts:['About ₹10.1 lakh, from 72 returns a day held for 10 days',
        'About ₹7.1 lakh, from one full week of returns held in the pipeline',
        'About ₹1.0 lakh, from a single day\'s returns waiting for inspection',
        'About ₹29.4 lakh, from the value of a full week of forward orders'],
  why:'<b>Returned stock is still inventory while it travels and waits, funded but unsellable.</b><div class="work">returns/day = 2,100 × 24% ÷ 7 = 72 pairs\nin pipeline = 72 × 10 days   = 720 pairs\nvalue       = 720 × ₹1,400   = ₹10.08 lakh</div>One week of returns (504 pairs) ignores that each return waits 10 days. A day\'s returns ignores the wait entirely. Forward orders are not returns.<br><br>The fix is upstream and fast: better size guidance, exchange-first and quicker local inspection, not making returns difficult for normal customers.'},

 /* ===================== 4 · THE FOUR PILLARS ===================== */
 {t:'pil',tag:'calc',diff:'medium',
  given:['Order: 150 units','Line rate: 45 units/hour','Hours before dispatch: 2.5'],
  q:'A caterer accepts an order for 150 units. The kitchen makes 45 an hour and has 2.5 hours before dispatch. What should the caterer have said when accepting?',
  opts:['About 112 can be ready; the other 38 need a later slot or extra capacity',
        'All 150 can be ready, because the order is now confirmed in the system',
        'About 135 can be ready, which is close enough to treat the order as full',
        'About 60 can be ready, since capacity is only set by the first hour\'s output'],
  why:'<b>An order is a request; capacity is what the line can make in the window.</b><div class="work">45 × 2.5 = 112.5 → 112 units\nshortfall = 150 − 112 = 38 (a quarter of the order)</div>"Confirmed, so it will happen" is the trap. 135 assumes three hours. A sales target and production capacity are not the same thing.<br><br>Promise against capacity, then negotiate the gap upfront rather than at the door.'},

 {t:'pil',tag:'apply',diff:'medium',
  q:'A rider reaches the address in the app on time, but it is the customer\'s old office; the saved address was never updated. The food is ready and hot. How should the failure be classified?',
  opts:['A last-mile information failure: goods flowed correctly, but the data driving them was wrong',
        'A production failure, because the product did not reach the customer at the time promised',
        'A rider performance failure, because the rider should have phoned to check with the customer first',
        'A demand-planning failure, because the platform did not forecast the customer\'s location'],
  why:'<b>The distribution pillar promises the right place, the right condition and the promised time.</b> A correct product sent to a wrong address is a data failure.<div class="work">product ready ✓   rider on time ✓   address data ✗\n→ customer outcome: not delivered</div>Blaming the rider is tempting but wrong; they followed the instruction they were given. The fix is address validation at order capture.<br><br>"The product is ready, the customer is still hungry" almost always points to last-mile data or handover.'},

 {t:'pil',tag:'concept',diff:'easy',cols:['Complaint','Gap behind it'],
  q:'Match each complaint to the gap behind it.',
  match:[['"But I ordered 300!" (the line makes 200 in the window)','Order ≠ capacity'],
         ['"All 300 are in stock!" (50 are past expiry)','Inventory ≠ availability'],
         ['"Ten more are joining, make it 40!"','Enthusiasm ≠ agreed forecast'],
         ['"The plan said 4:00, it arrived at 4:50"','Plan ≠ customer reality'],
         ['"The rider is at the old office address"','Right product, wrong place']],
  why:'Each complaint is a different pillar failing: <b>planning, sourcing and making, inventory, distribution</b>. If even one pillar fails, the customer experiences a flop, so never stop the diagnosis at "delivery failure".'},

 /* ===================== 5 · PRODUCTION MODELS ===================== */
 {t:'prod',tag:'concept',diff:'easy',cols:['Product','Best-fit model'],
  q:'Match each product to the production model that usually fits it.',
  match:[['A 100 g pack of a popular glucose biscuit','Make-to-stock'],
         ['A gaming PC built from chosen GPU, RAM and SSD modules','Assemble-to-order'],
         ['Made-to-measure office curtains for one building','Make-to-order'],
         ['A custom effluent-treatment plant for a new factory','Engineer-to-order']],
  why:'<b>As customer specificity rises, finished-goods inventory falls and customer waiting rises.</b> MTS holds finished goods; ATO holds modules; MTO holds materials and capacity; ETO holds only knowledge, supplier base and capacity.'},

 {t:'prod',tag:'apply',diff:'medium',
  q:'A paint company stocks white base paint at dealers and mixes the final shade on a tinting machine after the customer chooses. Where is the customer-order decoupling point, and what waits there?',
  opts:['At the dealer, just before tinting; base paint and tinting capability wait for the order',
        'At the factory, before production; raw pigments wait for each customer\'s order to arrive',
        'After the finished shade is made; every shade waits on the shelf as finished goods',
        'Before the design stage; engineering capability waits for each customer\'s brief'],
  why:'<b>The decoupling point is where forecast-driven work becomes order-driven work.</b> Find it with one question: what is complete before the order arrives?<div class="work">forecast-driven: produce base paint → position at dealers\n--- decoupling point (dealer) ---\norder-driven:    tint to chosen shade → hand over</div>Holding every shade as finished goods is MTS and would explode inventory. Factory-level and design-level boundaries describe MTO and ETO.<br><br>Late form postponement lets a network offer hundreds of shades without stocking hundreds of shades.'},

 {t:'prod',tag:'apply',diff:'medium',
  given:['Customer will wait: 3 days','Full production: 8 days','Final configuration: 1 day'],
  q:'An electronics brand sells configurable laptops. Customers will wait three days. Full production takes eight days; final configuration from stocked modules takes one. Which model fits?',
  opts:['Assemble-to-order: stock common modules and configure after the order',
        'Make-to-order: start production when the customer specification arrives',
        'Engineer-to-order: design each laptop after the customer signs off',
        'Make-to-stock: build every configuration in advance to ship at once'],
  why:'<b>If production takes longer than the customer will wait, some work must be done before the order.</b><div class="work">MTO: 8 days > 3-day tolerance        ✗\nATO: 1 day ≤ 3 days, modules pooled   ✓\nMTS: every combination in stock → huge FG risk</div>MTS would meet the wait but carry finished-goods risk across every combination. ETO is for unique engineering, not configurable products.<br><br>Match production lead time to customer waiting time, then hold inventory at the point that keeps variety cheap.'},

 {t:'prod',tag:'concept',diff:'medium',
  q:'A company moves its decoupling point upstream, from finished goods to before final assembly. What is the expected effect?',
  opts:['Lower finished-goods risk, but customers wait longer and modules must be on hand',
        'Faster customer response, because final assembly now starts before the order arrives',
        'Higher finished-goods exposure, because more work is completed ahead of demand',
        'No change in risk, because the production model is fixed by the sales channel'],
  why:'<b>Moving the boundary upstream reduces finished-goods risk but asks the customer to wait longer.</b><div class="work">MTS  boundary after finished product  fast   high FG exposure\nATO  boundary before assembly         moderate  component inventory\nMTO  boundary before production       longer    material inventory\nETO  boundary before design           longest   capability / project</div>The second and third options describe moving it downstream. The channel does not set the model; one store can sell MTS bread and MTO cakes.<br><br>Push upstream where scale matters; pull downstream where demand uncertainty matters.'},

 {t:'prod',tag:'concept',diff:'medium',cols:['What is delayed','Postponement type'],
  q:'Match each delayed decision to its form of postponement.',
  match:[['A tea brand holds plain blended tea and adds the flavour after regional demand is clear','Form'],
         ['A brand holds standard soaps and adds a festival or marketplace sleeve later','Packaging'],
         ['A bike maker keeps frames and wheels separate and assembles after the order','Assembly'],
         ['An apparel brand keeps stock central and releases it to whichever region sells','Fulfilment']],
  why:'<b>Postponement delays the commitment that creates variety.</b> It reduces variant-specific inventory, but only works when the delayed stage can respond fast and reliably, with accurate demand information and capacity close to the order point.'},

 {t:'prod',tag:'concept',diff:'medium',
  q:'Which pairing of production model and main risk is correct?',
  opts:['ATO carries component-balancing risk: one missing module can block several final products',
        'MTS carries scope risk: design changes after the order push up the project cost and delay delivery',
        'ETO carries forecast risk: unsold finished goods pile up when demand falls short',
        'MTO carries finished-goods risk: stock is built before any customer specification'],
  why:'<b>A model does not remove risk; it decides where the risk sits.</b><div class="work">MTS  forecast risk           unsold FG or stock-out\nATO  component-balancing     wrong module mix blocks assembly\nMTO  lead-time + capacity    customer waits during production\nETO  scope + project         design change hits cost and date</div>Each distractor attaches a real risk to the wrong model, so learn the four as a set.<br><br>A sound recommendation names the model, the boundary, the promise and the risk accepted.'},

 /* ===================== 6 · CHANNEL MODELS ===================== */
 {t:'chan',tag:'calc',diff:'medium',
  given:['Price ₹1,200','Product + pack ₹400','Payment, pick, pack ₹80','Shipping ₹100','Customer acquisition ₹300','Returns + support ₹90'],
  q:'A D2C haircare brand sells a ₹1,200 kit on its own website. What is the contribution per order after channel costs?',
  opts:['₹230 per order','₹800 per order','₹530 per order','₹320 per order'],
  why:'<b>D2C economics extend well beyond product margin.</b><div class="work">1,200 − 400 − 80 − 100 − 300 − 90 = ₹230 (≈19%)</div>₹800 stops at product margin. ₹530 forgets acquisition, which is the biggest D2C line. ₹320 forgets returns and support.<br><br>D2C gives control and customer data, but the brand also owns traffic, fulfilment and returns. It works when lifetime value justifies the cost of acquiring and serving each order.'},

 {t:'chan',tag:'concept',diff:'medium',trap:true,
  q:'A seller moves from seller fulfilment to the marketplace\'s own fulfilment network. Which statement is correct?',
  opts:['The platform now picks and ships, but the seller usually still funds the stock',
        'The platform now owns the stock, so the seller\'s working capital is released',
        'The seller keeps full control of the delivery promise and pays lower fees',
        'Returns become the platform\'s cost, so the seller\'s contribution no longer depends on them'],
  why:'<b>Platform fulfilment shifts execution, not ownership.</b><div class="work">                 seller-fulfilled      platform-fulfilled\nstock location   seller warehouse       platform FC\npick/pack        seller                 platform\npromise          seller + carrier       standardised by platform\nworking capital  seller funds           seller still funds (usually)\ncontrol          more, more variability  less, more fees and rules</div>The trap is assuming stock moves off the seller\'s books when it moves into the platform\'s warehouse. Returns still hit the seller\'s contribution.<br><br>Judge a marketplace order after fees, fulfilment, returns and working capital.'},

 {t:'chan',tag:'apply',diff:'medium',
  q:'A biscuit brand\'s distributor holds 12 days of stock, yet shoppers in many neighbourhood stores find the brand missing from the shelf. Where is the failure most likely to be?',
  opts:['Outlet execution: salesperson calls, retailer reorders and shelf replenishment',
        'Factory capacity: the plant is not producing enough for the distributor',
        'National forecasting: the brand has under-forecast total monthly demand',
        'Distributor credit: the distributor cannot afford to hold any more stock on credit'],
  why:'<b>Distribution width creates reach; outlet execution converts reach into consumer availability.</b><div class="work">factory ✓ → distributor ✓ (12 days) → outlet ✗ → shopper sees stock-out</div>The distributor has stock, so upstream capacity, the forecast and credit are not the binding constraint. A failure at either the distributor or the retailer node looks like a <i>brand</i> availability problem to the shopper.<br><br>The party that owns stock carries the cash exposure, but may not control final availability.'},

 {t:'chan',tag:'apply',diff:'medium',
  q:'Which SKU should a brand hold in one central warehouse rather than duplicate across city dark stores?',
  opts:['A long-tail accessory with low, unpredictable demand spread across many cities',
        'A fast-moving staple that sells steadily in every single neighbourhood every day',
        'An urgent-need item that customers only value if it arrives in minutes',
        'A high-velocity snack with dense, predictable demand in each catchment'],
  why:'<b>Pooling protects cash and range; duplication buys speed through proximity.</b><div class="work">central pool   lower safety stock, wider range, slower response\nduplicated     faster local response, more working capital,\n               imbalance risk</div>Uncertain, long-tail demand gains most from pooling, because errors across cities partly cancel. The other three are dense or urgent, which is exactly what local stock is for.<br><br>Moving stock closer improves response but raises duplication, space cost and replenishment complexity.'},

 {t:'chan',tag:'apply',diff:'medium',
  q:'A brand has 3,000 units of a new serum for four weeks and lists it on its website, a marketplace, beauty retail and quick commerce with an equal split. By week two the website is out of stock, retail has surplus and quick-commerce shows "unavailable". What principle was broken?',
  opts:['Allocation should follow each channel\'s demand, promise and economics, with shared visibility',
        'More channels always create more sales, so the stock should have been spread more widely',
        'Quick commerce should always receive first priority because it promises the fastest delivery service',
        'Each channel should run its own separate forecast and stock pool with no central view'],
  why:'<b>One product can travel through several channels, but each channel needs a clear job and its own stock logic.</b><div class="work">D2C        control + data      acquisition and returns cost\nretail     trial + possession  store stock, fixed cost\nmarketplace reach + comparison fees, returns, less control\nq-comm     speed               local stock density</div>Separate pools with no shared view create a stock-out in one channel and excess in another, which is exactly the symptom here. Speed is not an automatic priority; contribution and promise decide.<br><br>Share inventory visibility; do not force identical stock or service on every route.'},

 /* ===================== 7 · DEMAND PLANNING ===================== */
 {t:'dp',tag:'calc',diff:'medium',
  given:['W1 500','W2 520','W3 540','W4 860 (one-off promotion)','W5 380 (in stock 4 of 7 days)','W6 560'],
  q:'Six weeks of recorded sales are shown. What adjusted weekly run rate should go forward?',
  opts:['557 cases a week','560 cases a week','530 cases a week','608 cases a week'],
  why:'<b>Run rate = relevant demand ÷ comparable time units.</b> Exclude non-repeat events; normalise periods distorted by stock-outs.<div class="work">normalise W5: 380 ÷ 4 × 7 = 665\nexclude W4 (promotion)\n(500 + 520 + 540 + 665 + 560) ÷ 5 = 2,785 ÷ 5 = 557</div>560 is the raw six-week average; it happens to look close here, which is why the method matters more than the number. 530 drops W5 instead of repairing it. 608 keeps the promotion week in.<br><br>The period and the observations you choose matter as much as the arithmetic.'},

 {t:'dp',tag:'calc',diff:'hard',
  given:['Monthly recorded demand: 3,000','One-off institutional order inside it: 120','Stock-out gross missed demand: 200','Share that shifted to other outlets (already recorded): 30%'],
  q:'What is the normal monthly baseline?',
  opts:['3,020 cases','3,080 cases','2,880 cases','3,260 cases'],
  why:'<b>Baseline = monthlyised demand − non-repeat demand + missing repeat demand.</b> Restore only lost demand that is not already captured somewhere else.<div class="work">lost demand not captured = 200 × (1 − 0.30) = 140\nbaseline = 3,000 − 120 + 140 = 3,020</div>3,080 adds back the full 200, double-counting the 60 cases already recorded at other outlets. 2,880 forgets to restore lost demand. 3,260 adds the one-off order instead of removing it.<br><br>Never adjust the same distortion twice.'},

 {t:'dp',tag:'concept',diff:'medium',
  q:'A café\'s comparable weekly sales run 200, 208, 216, 224, then 330 in a festival week. How should a planner read this?',
  opts:['A steady upward trend in the first four weeks, plus a festival event handled separately',
        'A strong trend of about 65% growth, because the latest week is always the best evidence',
        'Seasonality only, because any rise that ends in a festival is a seasonal pattern',
        'No trend at all, because the festival week makes the whole series unusable'],
  why:'<b>Trend changes direction; seasonality changes timing; events create temporary movement.</b><div class="work">200 → 208 → 216 → 224   +4% a week, sustained → trend\n330                       one festival week → event spike</div>Treating the spike as trend would inflate every future month. Calling it all seasonality ignores the steady pre-festival growth. Throwing out the series wastes good evidence.<br><br>Trend deserves attention; context decides its weight.'},

 {t:'dp',tag:'calc',diff:'medium',
  given:['Baseline: 2,000','Trend +10%','Season +20%','Price change −10%','Confirmed event: +150'],
  q:'What is the forecast for the month?',
  opts:['2,526 units','2,550 units','2,376 units','2,790 units'],
  why:'<b>Forecast = baseline × trend × seasonal × price + event demand.</b> Multiply factors that change the whole base; add known incremental quantities.<div class="work">2,000 × 1.10 × 1.20 × 0.90 = 2,376\n+ 150 event                = 2,526</div>2,550 adds the percentages (+10 + 20 − 10 = +20%), which ignores compounding. 2,376 drops the event. 2,790 ignores the price factor.<br><br>Document each assumption, its owner and its revision trigger.'},

 {t:'dp',tag:'calc',diff:'medium',
  given:['National baseline: 2,000','North 60% · factor ×1.15','South 40% · factor ×0.90'],
  q:'Planners build a bottom-up forecast by region. What is the national total, and why does it differ from simply averaging the two factors?',
  opts:['2,100; each factor applies to its own regional base, so North\'s larger share counts more',
        '2,050; the national factor is the simple average of 1.15 and 0.90 applied to the 2,000 baseline',
        '2,000; regional factors cancel out at national level, so the baseline is unchanged',
        '2,300; the higher regional factor should be applied to the whole national baseline'],
  why:'<b>Regional forecasts apply local conditions to local baselines.</b><div class="work">North 1,200 × 1.15 = 1,380\nSouth   800 × 0.90 =   720\nbottom-up total    = 2,100\n(simple average 1.025 × 2,000 = 2,050 ✗)</div>Averaging factors ignores the regional weights. The split also tells you <i>where</i> to place inventory, which a national number never can.<br><br>National averages are useful checks; regional forecasts drive availability.'},

 {t:'dp',tag:'calc',diff:'hard',
  given:['Recurring campus programme: 80 cases potential','Probability it happens: 75%','Cases that would only replace normal outlet sales: 15'],
  q:'How many incremental cases should the programme add to the forecast?',
  opts:['45 cases','60 cases','80 cases','65 cases'],
  why:'<b>Weight uncertain demand by probability, then remove cannibalised volume already inside the baseline.</b><div class="work">expected = 80 × 75%  = 60\nincremental = 60 − 15 = 45</div>60 forgets cannibalisation. 80 treats a 75% event as certain. 65 removes cannibalisation but ignores probability.<br><br>Only truly incremental, evidence-weighted demand belongs in the forecast.'},

 {t:'dp',tag:'apply',diff:'hard',trap:true,
  given:['Regional total: 5,300','Duplicated campaign volume: 60','National e-commerce account no region owns: +120','Plant can supply: 5,100','Target: 5,800'],
  q:'What is the national demand forecast and the target gap?',
  opts:['Forecast 5,360 and gap 440; the supply limit belongs in the supply plan, not the forecast',
        'Forecast 5,100 and gap 700; demand cannot exceed what the plant is able to supply',
        'Forecast 5,800 and no gap; the forecast should match the target so all teams stay aligned',
        'Forecast 5,240 and gap 560; the e-commerce account is already inside the regions'],
  why:'<b>Reconcile: add demand no region owns, remove double counts, then compare with the target.</b><div class="work">5,300 − 60 + 120 = 5,360 forecast\ntarget gap = 5,800 − 5,360 = 440</div>Cutting the forecast to 5,100 hides a real shortfall that S&OP must decide on. Inflating it to 5,800 destroys forecast integrity. The stem says no region owns the e-commerce account, so it must be added.<br><br>A target gap closes through quantified actions, not by changing the forecast label.'},

 /* ===================== 8 · S&OP & FORECAST QUALITY ===================== */
 {t:'sop',tag:'calc',diff:'medium',trap:true,
  given:['Forecast: 120, 90, 110, 100','Actual: 100, 100, 100, 100','Error = Forecast − Actual'],
  q:'What are the WAPE and the bias, and what do they say?',
  opts:['WAPE 10%, bias +5%: the errors partly cancel, with a net lean to overforecasting',
        'WAPE 5%, bias +10%: the net error is smaller than the total size of the misses',
        'WAPE 10%, bias −5%: the plan is leaning towards underforecasting on balance',
        'WAPE 10%, bias 0%: the misses cancel out, so this forecast can be treated as good'],
  why:'<b>WAPE = Σ|F − A| ÷ ΣA (how wrong). Bias = Σ(F − A) ÷ ΣA (which way).</b><div class="work">errors  +20, −10, +10, 0\n|errors| 20 + 10 + 10 + 0 = 40 → WAPE 40 ÷ 400 = 10%\nnet     +20              → bias +20 ÷ 400 = +5%</div>Positive bias means forecast above actual: overforecast. Reading it as underforecast flips the sign convention. Even a 0% bias would not make it "good", since WAPE still shows 10% error.<br><br>A forecast needs both measures: WAPE for magnitude, bias for direction.'},

 {t:'sop',tag:'concept',diff:'medium',cols:['Number','What it is'],
  q:'Match each planning number to what it answers.',
  match:[['Forecast','What is most likely to sell; kept unbiased, never "approved"'],
         ['Target','What the business wants to achieve; an aspiration'],
         ['Supply plan','What operations can deliver after constraints'],
         ['Operating commitment','What we will sell, make, buy and fund; one cross-functional decision']],
  why:'<b>Do not mix the four numbers.</b> Demand planning produces a forecast; S&OP produces a decision. Raising the forecast to "match" the target hides the gap that needs actions with owners, dates and triggers.'},

 {t:'sop',tag:'case',diff:'medium',scene:sopCase,
  q:'<b>Part 1.</b> What should the launch operating commitment be?',
  opts:['60,000 from opening stock, own plant and confirmed contract, with the 8,000 option kept open',
        '72,000, because the target has leadership approval and the sales team needs the extra stock cover',
        '75,000, building the upside now by placing the import order for the extra volume',
        '50,000, committing to the downside only so no launch stock is ever left stranded'],
  why:'<b>Serve the base case and buy upside optionality; do not pre-build the target.</b><div class="work">2,000 opening + 40,000 own + 18,000 contract = 60,000 = base forecast\noptional contract +8,000 → 68,000 if triggered by T−4\nimport: 10-week lead > 6 weeks → 0 for launch</div>72,000 cannot be built on time: confirmed capacity is 60,000 and the import misses launch. 50,000 deliberately under-serves the most likely demand.<br><br>S&OP does not remove uncertainty; it makes the business ready to act when uncertainty resolves.'},

 {t:'sop',tag:'case',diff:'hard',scene:sopCase,
  q:'<b>Part 2.</b> Which way of handling the 12,000-case gap to target is strongest?',
  opts:['Keep 60,000 as forecast; name owned demand actions and book the 8,000 option only if orders cross a set level by T−4',
        'Raise the forecast to 72,000 so that sales, marketing, finance and supply all work to one shared launch number for planning',
        'Book the 8,000 option today and import 15,000 as well, so the full target is covered now',
        'Cut the target to 60,000 so the gap disappears and no further action needs to be planned'],
  why:'<b>The forecast stays honest; the gap becomes managed work with owners, dates and triggers.</b><div class="work">forecast 60,000 (unbiased) + action gap 12,000 = target 72,000\ntrigger: e.g. confirmed orders > 64,000 by T−4 → book 8,000\nassumption → owner → evidence → impact if wrong → review date</div>Forecast inflation hides the gap. Booking everything now strands cash if demand lands at base or downside, and the import cannot arrive in time anyway. Cutting the target abandons the ambition rather than managing it.<br><br>Flexibility has a deadline: decide before the option expires.'},

 /* ===================== 9 · SOURCING & CAPACITY ===================== */
 {t:'src',tag:'calc',diff:'medium',
  given:['Design capacity: 50,000','Planned downtime + changeovers: 6,000','Already committed to other SKUs: 6,000','Packaging shortfall limits: 3,000'],
  q:'What capacity can the plant safely promise to a new launch?',
  opts:['35,000 cases','44,000 cases','50,000 cases','41,000 cases'],
  why:'<b>Available capacity = effective capacity − committed load − known constraints.</b><div class="work">design     50,000\neffective  50,000 − 6,000 = 44,000\navailable  44,000 − 6,000 − 3,000 = 35,000</div>50,000 is the nameplate. 44,000 forgets existing commitments and materials. 41,000 forgets the committed load.<br><br>Never promise using nameplate capacity when the line, labour or material is already spoken for.'},

 {t:'src',tag:'calc',diff:'medium',trap:true,
  given:['Import: price ₹300 · freight ₹45 · duty ₹55 · financing ₹18 · quality ₹12','Domestic: price ₹360 · freight ₹8 · duty ₹0 · financing ₹6 · quality ₹10'],
  q:'Compare the two sources on landed cost per unit.',
  opts:['Import ₹430 vs domestic ₹384: ₹60 cheaper on price, ₹46 dearer landed',
        'Import ₹300 vs domestic ₹360: import is ₹60 cheaper, so it should win',
        'Import ₹400 vs domestic ₹374: freight and duty included, import ₹26 dearer',
        'Import ₹430 vs domestic ₹384: import is dearer, so it should never be used'],
  why:'<b>Purchase price is only the first line; landed cost counts the system.</b><div class="work">import    300 + 45 + 55 + 18 + 12 = ₹430\ndomestic  360 +  8 +  0 +  6 + 10 = ₹384\nprice gap −60 → landed gap +46</div>The quote comparison is the trap. ₹400/₹374 drops financing and quality. "Never use import" over-corrects: import can still suit stable base volume or unique capability, judged on lead time and flexibility too.<br><br>The cheapest unit can create the most expensive system.'},

 {t:'src',tag:'apply',diff:'medium',
  q:'Imported cans are 18% cheaper, but the MOQ is high and the lead time is ten weeks. Demand is volatile and the launch is in seven weeks. What is the best sourcing decision?',
  opts:['Use own and contract capacity for launch, and consider import later for stable replenishment',
        'Import the full launch volume now, because the unit cost advantage outweighs the timing risk',
        'Raise the forecast until the import MOQ is justified, then place the order immediately',
        'Delay the launch by three weeks so that the cheaper imported cans can arrive in time'],
  why:'<b>Own the core, buy flexibility from partners, import selectively.</b><div class="work">              control  lead time  flexibility        best fit\nown           high     shortest   internal capacity  core, stable volume\ncontract      medium   medium     optionality        variable volume\nimport        low–med  longest    low after PO       cost/capability, stable</div>The import misses launch by three weeks. Inflating the forecast to justify an MOQ corrupts planning. Delaying the launch sacrifices the commercial plan to save on cans.<br><br>Use cost, lead time and flexibility together; review the mix as demand stabilises.'},
];

 why:{eyebrow:'Section 01',title:'Why Managers Need Supply Chain',sub:'You may delegate execution. You cannot delegate the customer outcome.',

const CALCS={
 fc:{hint:'Move the factors and watch the difference between multiplying and adding.',
  ins:[{k:'b',nm:'Baseline',type:'number',def:2000},
       {k:'tr',nm:'Trend %',type:'range',min:-10,max:20,step:1,def:10},
       {k:'se',nm:'Seasonal %',type:'range',min:-20,max:30,step:1,def:20},
       {k:'pr',nm:'Price effect %',type:'range',min:-15,max:10,step:1,def:-10},
       {k:'ev',nm:'Event units',type:'number',def:150}],
  run:v=>{
   const m=(1+v.tr/100)*(1+v.se/100)*(1+v.pr/100), f=v.b*m+ +v.ev, a=v.b*(1+(v.tr+v.se+v.pr)/100)+ +v.ev;
   return 'Forecast = '+v.b+' × '+(1+v.tr/100).toFixed(2)+' × '+(1+v.se/100).toFixed(2)+' × '+(1+v.pr/100).toFixed(2)+' + '+v.ev+
    '<span class="big">'+Math.round(f).toLocaleString('en-IN')+'</span>'+
    '<span class="vd">Adding the percentages instead would give '+Math.round(a).toLocaleString('en-IN')+'; a gap of '+Math.round(a-f)+' from ignoring compounding.</span>';}},
 wape:{hint:'Type four forecasts against an actual of 100 each. Watch errors cancel in bias but not in WAPE.',
  ins:[{k:'f1',nm:'Forecast M1',type:'number',def:120},{k:'f2',nm:'Forecast M2',type:'number',def:90},
       {k:'f3',nm:'Forecast M3',type:'number',def:110},{k:'f4',nm:'Forecast M4',type:'number',def:100}],
  run:v=>{
   const F=[+v.f1,+v.f2,+v.f3,+v.f4], e=F.map(x=>x-100), abs=e.reduce((s,x)=>s+Math.abs(x),0), net=e.reduce((s,x)=>s+x,0);
   const w=abs/400*100, b=net/400*100;
   const d=b>2?['warn','Positive bias: leaning to overforecast; excess stock and blocked cash.']:b<-2?['bad','Negative bias: leaning to underforecast; stock-outs and expediting.']:['ok','Near-zero bias, but check WAPE before calling it good.'];
   return 'errors (F − A): '+e.join(', ')+'\nWAPE = '+abs+' ÷ 400   Bias = '+net+' ÷ 400'+
    '<span class="big">WAPE '+w.toFixed(1)+'% · Bias '+(b>0?'+':'')+b.toFixed(1)+'%</span>'+
    '<span class="vd '+d[0]+'">'+d[1]+'</span>';}},
};

function mcqNode(Q,card,onScore){

  const letters=['A','B','C','D','E'],order=shuffle(Q.opts.map((o,i)=>({o,i})));let done=false;
  order.forEach((item,pos)=>{
    const b=el('button','opt','<span class="lt">'+letters[pos]+'</span>'+item.o);
    b.onclick=e=>{
      if(done)return;done=true;box.dataset.done='1';const ok=item.i===0;
      [...opts.children].forEach((c,j)=>{c.disabled=true;

      box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));

}
/* a match-the-following question: Q.match=[[left,right],…], optional Q.cols=[leftHead,rightHead].
   Tap a left item, then a right item, to pair them; re-pair freely; Check scores it. */
const MATCH_COL=['#22d3ee','#a78bfa','#f472b6','#fbbf24','#34d399','#60a5fa','#fb923c','#e879f9'];
function matchNode(Q,card,onScore){
  const box=el('div','mtch');
  const tagLb={apply:'⚙ Apply',case:'🏷 Case',calc:'🧮 Calculate',concept:'◈ Concept'};
  let head='<span class="tag match">🔗 Match the following</span><span class="tag '+Q.tag+'">'+(tagLb[Q.tag]||'◈ Concept')+'</span>';
  if(Q.diff)head+='<span class="tag '+Q.diff+'">'+Q.diff+'</span>';
  if(Q.trap)head+='<span class="tag trap">🃏 tricky</span>';
  box.innerHTML=head+'<div class="q">'+Q.q+'</div><div class="mt-help">Tap an item on the left, then its match on the right. Tap again to re-pair.</div>';
  const n=Q.match.length, letters='ABCDEFGH';
  const right=shuffle(Q.match.map((p,i)=>({t:p[1],i})));          // i = index of the left item it belongs to
  const pair=new Array(n).fill(-1);                                 // left index → position in right[]
  let selL=-1, selR=-1, done=false;
  const grid=el('div','mt-grid');
  const colL=el('div','mt-col'), colR=el('div','mt-col');
  if(Q.cols){colL.appendChild(el('div','mt-h',Q.cols[0]));colR.appendChild(el('div','mt-h',Q.cols[1]));}
  const LB=[],RB=[];
  const L=Q.match.map((p,i)=>{const b=el('button','mt-item','<span class="mt-k">'+(i+1)+'</span><span class="mt-t">'+p[0]+'</span>');const bd=el('span','mt-b');b.appendChild(bd);LB.push(bd);colL.appendChild(b);return b;});
  const R=right.map((r,j)=>{const b=el('button','mt-item','<span class="mt-k">'+letters[j]+'</span><span class="mt-t">'+r.t+'</span>');const bd=el('span','mt-b');b.appendChild(bd);RB.push(bd);colR.appendChild(b);return b;});
  grid.appendChild(colL);grid.appendChild(colR);box.appendChild(grid);
  const row=el('div','mt-row');
  const chk=el('button','btn btn-grad mt-chk','Check answers');chk.disabled=true;
  const rst=el('button','btn mt-rst','Reset');
  const cnt=el('span','mt-cnt','0 / '+n+' paired');
  row.appendChild(chk);row.appendChild(rst);row.appendChild(cnt);box.appendChild(row);
  function paint(){
    L.forEach((b,i)=>{const j=pair[i];
      b.className='mt-item'+(i===selL?' sel':'')+(j>=0?' on':'');
      b.style.setProperty('--pc',j>=0?MATCH_COL[i%MATCH_COL.length]:'transparent');
      LB[i].textContent=j>=0?letters[j]:'';});
    R.forEach((b,j)=>{const i=pair.indexOf(j);
      b.className='mt-item'+(j===selR?' sel':'')+(i>=0?' on':'');
      b.style.setProperty('--pc',i>=0?MATCH_COL[i%MATCH_COL.length]:'transparent');
      RB[j].textContent=i>=0?String(i+1):'';});
    const k=pair.filter(x=>x>=0).length;cnt.textContent=k+' / '+n+' paired';chk.disabled=k<n;
  }
  function tryPair(){
    if(selL<0||selR<0)return;
    const prev=pair.indexOf(selR);if(prev>=0)pair[prev]=-1;
    pair[selL]=selR;selL=-1;selR=-1;
  }
  L.forEach((b,i)=>b.onclick=()=>{if(done)return;selL=(selL===i?-1:i);tryPair();paint();});
  R.forEach((b,j)=>b.onclick=()=>{if(done)return;selR=(selR===j?-1:j);tryPair();paint();});
  rst.onclick=()=>{if(done)return;pair.fill(-1);selL=selR=-1;paint();};
  chk.onclick=e=>{
    if(done||chk.disabled)return;done=true;box.dataset.done='1';
    let right_=0;
    L.forEach((b,i)=>{const ok=right[pair[i]].i===i;if(ok)right_++;
      b.disabled=true;b.classList.add(ok?'good':'bad');
      if(!ok){const want=right.findIndex(r=>r.i===i);LB[i].textContent=letters[pair[i]]+' → '+letters[want];}});
    R.forEach(b=>b.disabled=true);chk.disabled=true;rst.disabled=true;
    const ok=right_===n;
    cnt.textContent=right_+' / '+n+' correct';
    onAnswer(ok,e.clientX,e.clientY,card);onScore&&onScore(ok);
    const key=Q.match.map((p,i)=>(i+1)+'  '+p[0]+'  →  '+p[1]).join('\n');
    const why=el('div','why','<h5>'+(ok?'All matched →':right_+' of '+n+' right — the full key →')+'</h5><div class="work">'+key+'</div>'+(Q.why?'<p>'+Q.why+'</p>':''));
    box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));
  };
  paint();
  return box;
}

    qs.forEach(q=>{n++;
      if(q.scene&&q.scene!==lastScene){m.appendChild(sceneNode(q.scene));lastScene=q.scene;}
      if(!q.scene)lastScene=null;
      const card=el('div','qcard');
      card.appendChild(el('div','qnum','<span>Q'+n+' / '+ACTIVE.length+'</span>'));
      card.appendChild(mcqNode(q,card,ok=>{
        quizState.answered++;quizState.per[q.t].a++;
        if(ok){quizState.correct++;quizState.per[q.t].c++;if(q.trap)quizState.traps++;}
        else quizState.missed.push(q);
        const p=quizState.per[q.t];
        if(p.a===p.n&&p.c===p.n&&TBADGE[q.t])unlock(TBADGE[q.t]);
        if(TRAPS&&quizState.traps===TRAPS)unlock('b_trap');
        buildSidebar();updateFoot();}));
      m.appendChild(card);});
  });
  const rc=el('div','card hidden');rc.id='resultsCard';m.appendChild(rc);
  buildFoot();buildSidebar();
}

function calcNode(kind,title){
  const C=D_CALCS[kind]; if(!C)return el('div');
  const box=el('div','calc');
  box.innerHTML='<h4>⚡ '+title+'</h4><p class="hint">'+C.hint+'</p>';
  const inWrap=el('div','cin'), out=el('div','cout');
  const state={}; C.ins.forEach(i=>state[i.k]=i.def);
  const redraw=()=>{out.innerHTML=C.run(state);};
  C.ins.forEach(i=>{
    const lab=el('label');
    lab.innerHTML='<span class="nm">'+i.nm+'</span>';
    let inp,val=null;
    if(i.type==='select'){
      inp=el('select');
      inp.style.cssText='flex:2 1 170px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-family:inherit;font-size:13.5px;padding:7px 10px';
      i.opts.forEach(([v,lbl])=>{const o=el('option',null,lbl);o.value=v;inp.appendChild(o);});
      inp.value=i.def;
      inp.onchange=()=>{state[i.k]=inp.value;redraw();};
    } else {
      inp=el('input');
      inp.type=i.type==='range'?'range':'number';
      if(i.type==='range'){inp.min=i.min;inp.max=i.max;inp.step=i.step;}
      inp.value=i.def;
      val=i.type==='range'?el('span','val',String(i.def)):null;
      inp.oninput=()=>{const raw=parseFloat(inp.value);state[i.k]=isNaN(raw)?0:raw;if(val)val.textContent=String(state[i.k]);redraw();};
    }
    lab.appendChild(inp); if(val)lab.appendChild(val);
    inWrap.appendChild(lab);
  });
  box.appendChild(inWrap);box.appendChild(out);redraw();
  return box;
}

    core.onclick=()=>setScope('core');list.appendChild(core);

    all.innerHTML='<span class="idx">∞</span><span class="nm">Everything<small>'+D_QUIZ.length+' questions · adds the deep cuts</small></span>';
    all.onclick=()=>setScope('all');list.appendChild(all);
  } else {
    const all=el('div','topic scope'+(FOCUS?'':' on'));
    all.innerHTML='<span class="idx">◎</span><span class="nm">All sections<small>'+D_QUIZ.length+' questions · full paper</small></span>';
    all.onclick=()=>setScope('all');list.appendChild(all);
  }
  D_TOPICS.forEach((t,i)=>{
    const inScope=ACTIVE.some(q=>q.t===t.id);
    const p=quizState?quizState.per[t.id]:{c:0,n:0,a:0};
    const n=inScope?p.n:D_QUIZ.filter(q=>q.t===t.id).length;
    const d=el('div','topic'+(inScope&&p.a===p.n&&p.n?' done':'')+(t.hot?' hot':'')+(FOCUS===t.id?' on':'')+(inScope?'':' off'));

function grade(p){
  if(p>=90)return['Outstanding — exam-ready! 🏆','var(--lime)'];
  if(p>=75)return['Strong pass — polish the weak spots. ✅','var(--cyan)'];
  if(p>=60)return['Decent — a focused review will lift this. 📈','var(--gold)'];
  return['Keep going — reread the Why panels and retake. 🔁','var(--red)'];
}
function showResults(){
  const s=scored();if(!s)return;
  const{correct,total,per}=s,pct=Math.round(correct/total*100);
  MISSED=s.missed.slice();
  if(pct>=75)unlock('b_quiz75'); if(pct===100)unlock('b_perfect');
  const rc=$('#resultsCard');rc.className='card';rc.innerHTML='';
  rc.appendChild(el('div',null,'<div class="eyebrow">Results</div><h1 class="tt">Paper complete</h1>'));

  rw.innerHTML='<div class="ring"><svg width="200" height="200" viewBox="0 0 200 200">'+
    '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="16"/>'+
    '<circle id="ringArc" cx="100" cy="100" r="'+R+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/>'+
    '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs></svg>'+
    '<div class="mid"><div class="big" id="ringPct">0%</div><div class="sm">'+correct+' / '+total+'</div></div></div>';
  const g=grade(pct),gs=el('div');
  gs.innerHTML='<div class="grade" style="color:'+g[1]+'">'+g[0]+'</div><div class="sub">You answered '+correct+' of '+total+' correctly · longest streak <b>'+G.best+'</b> · tricky questions cleared <b>'+s.traps+'</b>.</div>';
  rw.appendChild(gs);rc.appendChild(rw);
  const meters=el('div','meters');let weak=null;
  const rows = MODE==='exam'
    ? D_CASES.map(c=>({id:c.id,name:c.cl+' · '+c.title.split('—')[0].trim(),p:per[c.id]}))
    : D_TOPICS.map(t=>({id:t.id,name:t.name,p:per[t.id]}));
  rows.forEach(r=>{const p=r.p;if(!p||!p.n)return;const ratio=p.c/p.n;
    if(weak===null||ratio<weak.r)weak={id:r.id,name:r.name,r:ratio};

      (MODE==='drill'?' <a style="color:var(--cyan);cursor:pointer" id="goWeak">Drill just this section →</a>':'')+'</p>';
    rc.appendChild(w);}
  const row=el('div','row-btns');

    const dr=el('button','btn btn-grad','🎯 Drill the '+MISSED.length+' I missed');
    dr.onclick=()=>setScope('missed');row.appendChild(dr);
  }
  const rt=el('button','btn '+(MODE==='drill'&&MISSED.length?'btn-ghost':'btn-grad'),'↺ Reshuffle &amp; Retake');
  rt.onclick=()=>{MODE==='exam'?renderExam():renderDrill();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
  row.appendChild(rt);

  requestAnimationFrame(()=>{
    const arc=$('#ringArc');arc.style.transition=reduced?'none':'stroke-dashoffset 1.1s var(--spring)';
    arc.style.strokeDashoffset=C*(1-pct/100);
    meters.querySelectorAll('.bar i').forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.w+'%',reduced?0:120+i*80));
    const node=$('#ringPct');
    if(reduced)node.textContent=pct+'%';
    else{const t0=performance.now();(function tk(now){const p=Math.min(1,(now-t0)/1100);node.textContent=Math.round(pct*p)+'%';if(p<1)requestAnimationFrame(tk);})(t0);}
  });
  const wb=$('#goWeak');if(wb)wb.onclick=()=>setScope('topic',weak.id);
  if(pct>=75){sfxFanfare();confetti(140);crackers(innerWidth*0.5,innerHeight*0.38,14);mega(pct===100?'👑':'🎉',true);bigCall(pct===100?'FLAWLESS! 👑':'WELL PLAYED! 🎉');}
  else{sfxSad();mega('😬',false);}

  const x=el('button','x','×');x.onclick=close;
  ovl.appendChild(x);ovl.appendChild(card);
  ovl.onclick=e=>{if(e.target===ovl)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* ---------- the map (cheat-sheet) ---------- */
$('#hMap').onclick=()=>{
  if(!D_CMAP.length||$('#cmapOvl'))return;
  const ovl=el('div','ovl');ovl.id='cmapOvl';
  const card=el('div','card');
  card.innerHTML='<div class="eyebrow">Reference</div><h1 class="tt">'+(CFG.mapTitle||'The Map')+' 📋</h1>'+
    '<div class="sub">'+(CFG.mapIntro||'The whole course on one page. <b>Bold</b> marks the bit that usually carries the mark; the blocks marked ★ are the ones worth reading last, on the morning of the paper.')+'</div>';
  D_CMAP.forEach(b=>{
    const blk=el('div','cm-block');
    blk.innerHTML='<h4>'+b.h+'</h4><p class="cm-note">'+b.note+'</p>';
    const sc=el('div','cm-scroll');
    const cells=b.rows.map(r=>r.filter(c=>c!=='')), cols=Math.max(...cells.map(r=>r.length));
    sc.innerHTML='<table><tbody>'+cells.map(r=>
      '<tr>'+r.map((c,i)=>{
        const span=(i===r.length-1&&r.length<cols)?' colspan="'+(cols-i)+'"':'';
        return '<td'+span+'>'+c+'</td>';
      }).join('')+'</tr>').join('')+'</tbody></table>';
    blk.appendChild(sc);card.appendChild(blk);

  const row=el('div','row-btns');

/* =========================================================================
   OPTIONAL HELPER · supply & demand diagram for written answers
   Use in a PAPER or open question as   svg:{d:0.2,s:-0.3,cap:'…'}
   d / s  = shift size, positive = rightward.   line:{p,label} draws a
   price ceiling or floor and marks the Qd / Qs gap.
   ========================================================================= */
function dsSvg(o){
  const W=430,H=300,X0=56,X1=390,Y0=34,Y1=250;
  const mx=q=>X0+q*(X1-X0), my=p=>Y1-p*(Y1-Y0);
  const dP=(q,d)=>0.9-0.8*q+d, sP=(q,s)=>0.1+0.8*q-s;
  const eq=(d,s)=>{const q=(0.8+d+s)/1.6;return{q,p:0.1+0.8*q-s};};
  const line=(f,a)=>'M '+mx(0)+' '+my(f(0,a))+' L '+mx(1)+' '+my(f(1,a));
  const d=o.d||0, s=o.s||0, e0=eq(0,0), e1=eq(d,s);
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="Supply and demand diagram">'+
    '<defs><clipPath id="cp'+(dsSvg.n=(dsSvg.n||0)+1)+'"><rect x="'+X0+'" y="'+Y0+'" width="'+(X1-X0)+'" height="'+(Y1-Y0)+'"/></clipPath></defs>'+
    '<g clip-path="url(#cp'+dsSvg.n+')">';
  g+='<path d="'+line(dP,0)+'" stroke="#22D3EE" stroke-width="2.4" fill="none"/>'+
     '<path d="'+line(sP,0)+'" stroke="#FBBF24" stroke-width="2.4" fill="none"/>';
  if(d)g+='<path d="'+line(dP,d)+'" stroke="#22D3EE" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/>';
  if(s)g+='<path d="'+line(sP,s)+'" stroke="#FBBF24" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/>';
  const dot=(q,p,c,r)=>'<circle cx="'+mx(q)+'" cy="'+my(p)+'" r="'+(r||5)+'" fill="'+c+'"/>';
  const dash=(q,p,c)=>'<path d="M '+X0+' '+my(p)+' L '+mx(q)+' '+my(p)+' L '+mx(q)+' '+Y1+'" stroke="'+c+'" stroke-width="1.2" stroke-dasharray="3 4" fill="none" opacity=".6"/>';
  if(o.line){
    const lp=o.line.p, qd=(0.9-lp)/0.8, qs=(lp-0.1)/0.8;
    g+='<path d="M '+X0+' '+my(lp)+' L '+X1+' '+my(lp)+'" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="8 4" fill="none"/>'+
       '<path d="M '+mx(Math.min(qd,qs))+' '+my(lp)+' L '+mx(Math.max(qd,qs))+' '+my(lp)+'" stroke="#FB7185" stroke-width="7" opacity=".3" fill="none"/>'+
       dot(qs,lp,'#FB7185',4)+dot(qd,lp,'#FB7185',4)+
       '<text x="'+mx(qs)+'" y="'+(my(lp)+20)+'" fill="#FB7185" font-size="11" text-anchor="middle">Qs</text>'+
       '<text x="'+mx(qd)+'" y="'+(my(lp)+20)+'" fill="#FB7185" font-size="11" text-anchor="middle">Qd</text>';
  }
  g+=dash(e0.q,e0.p,'#9AA6C9')+dot(e0.q,e0.p,'#E7ECFF');
  if(d||s)g+=dash(e1.q,e1.p,'#4ADE80')+dot(e1.q,e1.p,'#4ADE80',6);
  g+='</g>';
  g+='<path d="M '+X0+' '+Y0+' L '+X0+' '+Y1+' L '+X1+' '+Y1+'" stroke="#9AA6C9" stroke-width="1.6" fill="none"/>'+
     '<text x="'+(X0-8)+'" y="'+(Y0+10)+'" fill="#9AA6C9" font-size="12" text-anchor="end">P</text>'+
     '<text x="'+X1+'" y="'+(Y1+20)+'" fill="#9AA6C9" font-size="12" text-anchor="end">Q</text>'+
     '<text x="'+(mx(1)-4)+'" y="'+(my(dP(1,0))-8)+'" fill="#22D3EE" font-size="12" text-anchor="end">D</text>'+
     '<text x="'+(mx(1)-4)+'" y="'+(my(sP(1,0))+16)+'" fill="#FBBF24" font-size="12" text-anchor="end">S</text>';
  if(d)g+='<text x="'+(mx(1)-4)+'" y="'+(my(dP(1,d))+(d>0?-8:16))+'" fill="#22D3EE" font-size="12" text-anchor="end">D₂</text>';
  if(s)g+='<text x="'+(mx(1)-4)+'" y="'+(my(sP(1,s))+(s>0?16:-8))+'" fill="#FBBF24" font-size="12" text-anchor="end">S₂</text>';
  if(o.line)g+='<text x="'+(X0+8)+'" y="'+(my(o.line.p)-8)+'" fill="#FB7185" font-size="12">'+o.line.label+'</text>';
  g+='</svg>';
  return '<div class="dsg">'+g+'<div class="cap">'+(o.cap||'')+'</div></div>';
}

if(MODE==='exam')renderExam(); else if(MODE==='learn')renderLearn(); else if(MODE==='paper')renderPaper(); else renderDrill();
</script>
